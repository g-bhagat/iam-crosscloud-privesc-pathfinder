<svg width="100%" viewBox="0 0 760 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">System architecture for the cross-cloud IAM privilege escalation path analyzer</title>
<desc id="desc">AWS and GCP sandbox APIs feed dedicated collectors, which populate a unified identity graph. The graph flows through a correlation engine, escalation rule engine, and pathfinder in sequence, producing a remediation report and an interactive visualization as outputs.</desc>

<style>
  .box { stroke-width: 1; rx: 8; }
  .gray  { fill: #1c2028; stroke: #3a3f4b; }
  .teal  { fill: #0f2e2e; stroke: #2dd4bf; }
  .amber { fill: #332711; stroke: #f5b642; }
  .th { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; font-weight: 600; font-size: 14px; fill: #e8e9ec; }
  .ts { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #9a9fab; }
  .arr { stroke: #6b7280; stroke-width: 1.5; fill: none; }
  .legend { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #9a9fab; }
</style>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<g>
  <rect class="box gray" x="100" y="40" width="200" height="50" rx="8"/>
  <text class="th" x="200" y="58" text-anchor="middle" dominant-baseline="central">AWS Sandbox</text>
  <text class="ts" x="200" y="75" text-anchor="middle" dominant-baseline="central">IAM / STS API</text>
</g>

<g>
  <rect class="box gray" x="460" y="40" width="200" height="50" rx="8"/>
  <text class="th" x="560" y="58" text-anchor="middle" dominant-baseline="central">GCP Sandbox</text>
  <text class="ts" x="560" y="75" text-anchor="middle" dominant-baseline="central">IAM / Asset API</text>
</g>

<line x1="200" y1="90" x2="200" y2="120" class="arr" marker-end="url(#arrow)"/>
<line x1="560" y1="90" x2="560" y2="120" class="arr" marker-end="url(#arrow)"/>

<g>
  <rect class="box gray" x="100" y="120" width="200" height="50" rx="8"/>
  <text class="th" x="200" y="138" text-anchor="middle" dominant-baseline="central">AWS Collector</text>
  <text class="ts" x="200" y="155" text-anchor="middle" dominant-baseline="central">boto3, read-only</text>
</g>

<g>
  <rect class="box gray" x="460" y="120" width="200" height="50" rx="8"/>
  <text class="th" x="560" y="138" text-anchor="middle" dominant-baseline="central">GCP Collector</text>
  <text class="ts" x="560" y="155" text-anchor="middle" dominant-baseline="central">Asset Inventory API</text>
</g>

<line x1="200" y1="170" x2="310" y2="200" class="arr" marker-end="url(#arrow)"/>
<line x1="560" y1="170" x2="450" y2="200" class="arr" marker-end="url(#arrow)"/>

<g>
  <rect class="box teal" x="230" y="200" width="300" height="56" rx="8"/>
  <text class="th" x="380" y="220" text-anchor="middle" dominant-baseline="central">Unified Identity Graph</text>
  <text class="ts" x="380" y="238" text-anchor="middle" dominant-baseline="central">NetworkX / graph model</text>
</g>

<line x1="380" y1="256" x2="145" y2="290" class="arr" marker-end="url(#arrow)"/>

<g>
  <rect class="box teal" x="40" y="290" width="210" height="56" rx="8"/>
  <text class="th" x="145" y="310" text-anchor="middle" dominant-baseline="central">Correlation Engine</text>
  <text class="ts" x="145" y="328" text-anchor="middle" dominant-baseline="central">FEDERATES_WITH edges</text>
</g>

<line x1="250" y1="318" x2="270" y2="318" class="arr" marker-end="url(#arrow)"/>

<g>
  <rect class="box teal" x="270" y="290" width="210" height="56" rx="8"/>
  <text class="th" x="375" y="310" text-anchor="middle" dominant-baseline="central">Escalation Rules</text>
  <text class="ts" x="375" y="328" text-anchor="middle" dominant-baseline="central">5 pattern checks</text>
</g>

<line x1="480" y1="318" x2="500" y2="318" class="arr" marker-end="url(#arrow)"/>

<g>
  <rect class="box teal" x="500" y="290" width="210" height="56" rx="8"/>
  <text class="th" x="605" y="310" text-anchor="middle" dominant-baseline="central">Pathfinder</text>
  <text class="ts" x="605" y="328" text-anchor="middle" dominant-baseline="central">walk to admin nodes</text>
</g>

<line x1="605" y1="346" x2="265" y2="380" class="arr" marker-end="url(#arrow)"/>
<line x1="605" y1="346" x2="485" y2="380" class="arr" marker-end="url(#arrow)"/>

<g>
  <rect class="box amber" x="165" y="380" width="200" height="56" rx="8"/>
  <text class="th" x="265" y="400" text-anchor="middle" dominant-baseline="central">Remediation Report</text>
  <text class="ts" x="265" y="418" text-anchor="middle" dominant-baseline="central">diff + severity score</text>
</g>

<g>
  <rect class="box amber" x="385" y="380" width="200" height="56" rx="8"/>
  <text class="th" x="485" y="400" text-anchor="middle" dominant-baseline="central">Visualization</text>
  <text class="ts" x="485" y="418" text-anchor="middle" dominant-baseline="central">interactive HTML</text>
</g>

<text x="380" y="470" text-anchor="middle" class="legend">gray = data source / collection · teal = core graph &amp; analysis · amber = output artifacts</text>
</svg>
